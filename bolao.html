<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Copa - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #4e9454; display: flex; align-items: center; min-height: 100vh; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #fff; border: none; }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <div class="card card-custom p-4 text-center">
        <h2 class="fw-bold text-success mb-3">🏆 Bolão da Copa</h2>
        <p class="text-muted">Entre com suas credenciais para dar palpites</p>
        
        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Usuário de Acesso</label>
                <input type="text" id="usernameInput" class="form-control form-control-lg" placeholder="Ex: joao_silva" required>
            </div>
            
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" id="passwordInput" class="form-control form-control-lg" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" id="btnEntrar" class="btn btn-success btn-lg w-100 shadow mb-3">Entrar no Sistema</button>
        </form>

        <hr>
        
        <p class="mb-0 text-muted">
            Não tem uma conta? <a href="./cadastro.html" class="text-success fw-bold text-decoration-none">Criar conta agora</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://phirqisfutnwqhhswjxh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY";
    
    let supabaseClient;

    // Garante a inicialização correta independente do tipo de carregamento do navegador
    try {
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else if (typeof Supabase !== 'undefined') {
            supabaseClient = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
            throw new Error("Biblioteca do Supabase não foi carregada pelo navegador.");
        }
    } catch (e) {
        alert("❌ Erro ao iniciar o Banco no Login:\n" + e.message);
    }

    // Evento de Login
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById("btnEntrar");
        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;

        btn.disabled = true;
        btn.innerText = "Verificando credenciais...";

        try {
            // Consulta no Supabase procurando pelo usuário e senha exatos
            const { data, error } = await supabaseClient
                .from('palpiteiro')
                .select('usuario, nome_completo')
                .eq('usuario', username)
                .eq('senha', password);

            if (error) {
                alert("❌ Erro ao consultar o banco: " + error.message);
                return;
            }

            // Se retornar dados (data.length > 0), o login é válido
            if (data && data.length > 0) {
                // Armazena o usuário atual no localStorage para uso nas próximas telas (ex: palpites.html)
                localStorage.setItem("bolao_user", username);
                
                alert(`👋 Bem-vindo de volta, ${data[0].nome_completo}!`);
                window.location.href = "./menu.html"; 
            } else {
                // Se o retorno vier vazio, as credenciais estão erradas
                alert("❌ Usuário ou senha incorretos! Verifique os dados ou crie uma nova conta.");
            }

        } catch (err) {
            alert("❌ Erro de rede ao tentar fazer login: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Entrar no Sistema";
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpites Copa do Mundo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; color: #334155; }
        .container { max-width: 800px; margin: auto; }
        .grid-grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 5px; margin-top: 0; }
        select { width: 100%; margin: 5px 0; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; }
        .final-inputs { display: grid; gap: 10px; background: #e2e8f0; padding: 20px; border-radius: 12px; }
        button { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

</div>

    const container = document.getElementById('container-grupos');

    for (const [letra, times] of Object.entries(grupos)) {

                <select id="g${letra}_1" class="time-select" onchange="validarSelecao('${letra}')">

                    ${times.map(t => `<option value="${t}">${t}</option>`).join('')}

            </div>
        `;
    }

    function validarSelecao(letra) {
        const p1 = document.getElementById(`g${letra}_1`).value;
        const p2 = document.getElementById(`g${letra}_2`).value;
        if (p1 && p1 === p2) {

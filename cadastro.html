<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container" style="max-width: 400px;">
    <div class="card p-4 shadow">
        <h3 class="text-center text-success mb-4">Criar Conta</h3>
        <form id="formCadastro">
            <div class="mb-3">
                <label>Nome Completo</label>
                <input type="text" id="nomeCompleto" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Usuário</label>
                <input type="text" id="usuario" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Senha</label>
                <input type="password" id="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
        </form>
        <div id="mensagem" class="mt-3"></div>
        <p class="text-center mt-3">Já tem conta? <a href="index.html">Entrar</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://phirqisfutnwqhhswjxh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nome = document.getElementById('nomeCompleto').value;
        const user = document.getElementById('usuario').value;
        const pass = document.getElementById('senha').value;
        const msg = document.getElementById('mensagem');

        msg.innerHTML = "Verificando...";

        // 1. Verifica se o usuário já existe na tabela 'palpiteiro'
        const { data: existingUser, error: checkError } = await db
            .from('palpiteiro')
            .select('usuario')
            .eq('usuario', user);

        if (checkError) {
            msg.innerHTML = `<div class="alert alert-danger">Erro ao verificar: ${checkError.message}</div>`;
            return;
        }

        if (existingUser && existingUser.length > 0) {
            msg.innerHTML = `<div class="alert alert-warning">❌ Usuário já cadastrado!</div>`;
            return;
        }

        // 2. Insere na tabela 'palpiteiro'
        const { error: insertError } = await db.from('palpiteiro').insert([{ 
            nome_completo: nome, 
            usuario: user, 
            senha: pass 
        }]);

        if (insertError) {
            msg.innerHTML = `<div class="alert alert-danger">Erro ao cadastrar: ${insertError.message}</div>`;
        } else {
            msg.innerHTML = `<div class="alert alert-success">✅ Cadastrado! Redirecionando...</div>`;
            setTimeout(() => window.location.href = './index.html', 1500);
        }
    });
</script>
</body>
</html>

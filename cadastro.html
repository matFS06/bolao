<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Centralização e Estilo de Fundo igual ao Login */
        body { background-color: #4e9454; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: #fff; border: none; }
    </style>
</head>
<body>

<div class="container" style="max-width: 400px;">
    <div class="card card-custom p-4">
        <h3 class="text-center fw-bold text-success mb-4">Criar Conta</h3>
        <form id="formCadastro">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Nome Completo</label>
                <input type="text" id="nomeCompleto" class="form-control" placeholder="Seu nome" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Usuário</label>
                <input type="text" id="usuario" class="form-control" placeholder="Escolha um usuário" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="Crie uma senha" required>
            </div>
            <button type="submit" id="btnCadastro" class="btn btn-success btn-lg w-100 mt-2">Cadastrar</button>
        </form>
        
        <div id="mensagem" class="mt-3"></div>
        
        <p class="text-center mt-3 text-muted">Já tem conta? <a href="index.html" class="text-success fw-bold text-decoration-none">Entrar</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://phirqisfutnwqhhswjxh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnCadastro');
        const nome = document.getElementById('nomeCompleto').value;
        const user = document.getElementById('usuario').value.trim();
        const pass = document.getElementById('senha').value;
        const msg = document.getElementById('mensagem');

        btn.disabled = true;
        msg.innerHTML = '<div class="text-center text-success">Verificando...</div>';

        // 1. Verifica se o usuário já existe
        const { data: existingUser, error: checkError } = await db
            .from('palpiteiro')
            .select('usuario')
            .eq('usuario', user);

        if (checkError) {
            msg.innerHTML = `<div class="alert alert-danger">Erro: ${checkError.message}</div>`;
            btn.disabled = false;
            return;
        }

        if (existingUser && existingUser.length > 0) {
            msg.innerHTML = `<div class="alert alert-warning">❌ Usuário já existe! Escolha outro.</div>`;
            btn.disabled = false;
            return;
        }

        // 2. Insere novo usuário
        const { error: insertError } = await db.from('palpiteiro').insert([{ 
            nome_completo: nome, 
            usuario: user, 
            senha: pass 
        }]);

        if (insertError) {
            msg.innerHTML = `<div class="alert alert-danger">Erro ao cadastrar: ${insertError.message}</div>`;
            btn.disabled = false;
        } else {
            msg.innerHTML = `<div class="alert alert-success">✅ Sucesso! Redirecionando...</div>`;
            setTimeout(() => window.location.href = './index.html', 1500);
        }
    });
</script>
</body>
</html>

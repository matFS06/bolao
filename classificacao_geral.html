<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificação Geral - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Configuração do Fundo */
        body {
            background-image: url('bg_bolao.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: scroll; /* Scroll permite que o fundo se ajuste ao conteúdo */
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        /* Container com fundo translúcido para leitura */
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            /* Permite que o container encolha proporcionalmente ao zoom */
            width: 95%; 
            max-width: 900px;
        }

        /* Estilos dos elementos da tabela */
        .table {
            background-color: transparent !important;
        }

        .group-header { 
            background-color: #198754; 
            color: white; 
            padding: 5px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.9em; 
        }
    </style>
</head>
<body class="p-4 bg-light">

<div class="container" style="max-width: 900px;">
    <h2 class="text-success fw-bold text-center mb-4">🏆 Classificação Geral</h2>
    
    <div id="loading" class="text-center text-muted">Carregando ranking...</div>
    
    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-success">
            <tr>
                <th>Pos</th>
                <th>Nome Completo</th>
                <th>Usuário</th>
                <th>Pontos (Exatos)</th>
                <th>Auditoria</th>
            </tr>
        </thead>
        <tbody id="tabelaRanking"></tbody>
    </table>

    <a href="menu.html" class="btn btn-secondary w-100 mt-3">Voltar ao Menu</a>
</div>

<div class="modal fade" id="modalAuditoria" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Palpites de: <span id="spanUser"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="corpoModal">Carregando...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const db = supabase.createClient("https://phirqisfutnwqhhswjxh.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY");
    
    const jogosConfig = { 
        'a': ["México x África do Sul", "Coreia do Sul x Rep. Tcheca", "Rep. Tcheca x África do Sul", "México x Coreia do Sul", "África do Sul x Coreia do Sul", "Rep. Tcheca x México"], 
        'b': ["Canadá x Bósnia", "Catar x Suíça", "Suíça x Bósnia", "Canadá x Catar", "Suíça x Canadá", "Bósnia x Catar"], 
        'c': ["Brasil x Marrocos", "Haiti x Escócia", "Escócia x Marrocos", "Brasil x Haiti", "Marrocos x Haiti", "Escócia x Brasil"], 
        'd': ["EUA x Paraguai", "Austrália x Turquia", "EUA x Austrália", "Turquia x Paraguai", "Turquia x EUA", "Paraguai x Austrália"], 
        'e': ["Alemanha x Curaçau", "Costa do Marfim x Equador", "Alemanha x Costa do Marfim", "Equador x Curaçau", "Equador x Alemanha", "Curaçau x Costa do Marfim"], 
        'f': ["Holanda x Japão", "Suécia x Tunísia", "Holanda x Suécia", "Tunísia x Japão", "Tunísia x Holanda", "Japão x Suécia"], 
        'g': ["Bélgica x Egito", "Irã x N. Zelândia", "Bélgica x Irã", "N. Zelândia x Egito", "Egito x Irã", "N. Zelândia x Bélgica"], 
        'h': ["Espanha x Cabo Verde", "Arábia Saudita x Uruguai", "Espanha x Arábia Saudita", "Uruguai x Cabo Verde", "Cabo Verde x Arábia Saudita", "Uruguai x Espanha"], 
        'i': ["França x Senegal", "Iraque x Noruega", "França x Iraque", "Noruega x Senegal", "Senegal x Iraque", "Noruega x França"], 
        'j': ["Argentina x Argélia", "Áustria x Jordânia", "Argentina x Áustria", "Jordânia x Argélia", "Jordânia x Argentina", "Argélia x Áustria"], 
        'k': ["Portugal x RD Congo", "Uzbequistão x Colômbia", "Portugal x Uzbequistão", "Colômbia x RD Congo", "RD Congo x Uzbequistão", "Colômbia x Portugal"], 
        'l': ["Inglaterra x Croácia", "Gana x Panamá", "Inglaterra x Gana", "Panamá x Croácia", "Croácia x Gana", "Panamá x Inglaterra"] 
    };

    async function verPalpites(usuario) {
        document.getElementById('spanUser').innerText = usuario;
        const modalBody = document.getElementById('corpoModal');
        modalBody.innerHTML = "Carregando...";
        new bootstrap.Modal(document.getElementById('modalAuditoria')).show();

        const { data, error } = await db.from('palpitescopa').select('*').eq('nome_usuario', usuario);
        if (error || !data || data.length === 0) { 
            modalBody.innerHTML = "Erro ao carregar ou palpites não encontrados."; 
            return; 
        }
        
        const p = data[0];
        
        let html = `<div class="row">`;
        ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l'].forEach(letra => {
            html += `
            <div class="col-6 mb-2">
                <div class="border rounded p-1 text-center">
                    <div class="group-header">Grupo ${letra.toUpperCase()}</div>
                    <small>1º: <b>${p[`grupo_${letra}_1`]}</b><br>2º: <b>${p[`grupo_${letra}_2`]}</b></small>
                </div>
            </div>`;
        });
        html += `</div>`;

        html += `<h6 class="mt-3">Placares dos Jogos:</h6>`;
        for (let letra in jogosConfig) {
            let offset = (letra.charCodeAt(0) - 97) * 6;
            html += `
            <div class="accordion mb-2" id="acc${letra}">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#c${letra}">
                            Grupo ${letra.toUpperCase()}
                        </button>
                    </h2>
                    <div id="c${letra}" class="accordion-collapse collapse" data-bs-parent="#acc${letra}">
                        <div class="accordion-body p-2">
                            ${jogosConfig[letra].map((jogo, i) => {
                                let idx = offset + i + 1;
                                return `<div class="d-flex justify-content-between border-bottom py-1"><span>${jogo}</span> <b>${p['j'+idx+'m']} x ${p['j'+idx+'v']}</b></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        html += `
        <div class="card mt-3 border-success">
            <div class="card-body p-2">
                <h6 class="text-success">🏆 Top 4 Final:</h6>
                <p class="mb-1">🥇 ${p.campeao} | 🥈 ${p.vice}</p>
                <p class="mb-1">🥉 ${p.terceiro} | 🏅 ${p.quarto}</p>
                <hr class="my-1">
                <p class="mb-0">⚽ 1º Gol do Brasil: <b>${p.autor_gol}</b></p>
            </div>
        </div>`;
        
        modalBody.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const tabela = document.getElementById('tabelaRanking');
        const loading = document.getElementById('loading');

        try {
            // Traz os dados ordenados por pontos (Maior pro menor) e depois por placares exatos (Maior pro menor)
            const [ { data: palpites }, { data: usuarios } ] = await Promise.all([
                db.from('palpitescopa')
                  .select('nome_usuario, pontuacao, placares_exatos')
                  .order('pontuacao', { ascending: false })
                  .order('placares_exatos', { ascending: false }),
                db.from('palpiteiro').select('usuario, nome_completo')
            ]);

            loading.style.display = 'none';

            if (!palpites || empty(palpites) || palpites.length === 0) {
                tabela.innerHTML = `<tr><td colspan="5" class="text-center">Nenhum palpite registrado.</td></tr>`;
                return;
            }

            // Variáveis de controle para a lógica de empate clássico
            let posicaoAtual = 1;
            let ultimaPontuacao = -1;
            let ultimosPlacaresExatos = -1;

            palpites.forEach((p, index) => {
                const userObj = usuarios ? usuarios.find(u => u.usuario === p.nome_usuario) : null;
                const nomeCompleto = userObj ? userObj.nome_completo : '---';

                // Lógica de empate olímpica: se tiver os mesmos pontos E mesmos placares exatos do anterior, divide a posição.
                // Caso contrário, assume a posição correspondente ao índice real da lista + 1 (ex: pula do 1º para o 4º).
                if (index > 0 && p.pontuacao === ultimaPontuacao && p.placares_exatos === ultimosPlacaresExatos) {
                    // Mantém a mesma posicaoAtual anterior
                } else {
                    posicaoAtual = index + 1;
                }

                // Atualiza o histórico para comparar com o próximo jogador da iteração
                ultimaPontuacao = p.pontuacao;
                ultimosPlacaresExatos = p.placares_exatos;

                // Garante que se a coluna estiver vazia ou nula no banco, exiba 0
                const exatosExibicao = p.placares_exatos || 0;

                tabela.innerHTML += `<tr>
                    <td><b>${posicaoAtual}º</b></td>
                    <td>${nomeCompleto}</td>
                    <td>${p.nome_usuario}</td>
                    <td class="fw-bold text-success">${p.pontuacao} <small class="text-muted fw-normal">(${exatosExibicao} crav.)</small></td>
                    <td>
                        <button class="btn btn-sm btn-outline-success" onclick="verPalpites('${p.nome_usuario}')">
                            👁️ Ver
                        </button>
                    </td>
                </tr>`;
            });
        } catch (err) {
            loading.innerText = "Erro ao carregar: " + err.message;
        }
    });

    // Função auxiliar caso o retorno venha vazio por algum motivo
    function empty(obj) { return !obj || Object.keys(obj).length === 0; }
</script>
</body>
</html>

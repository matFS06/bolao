<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificação Geral - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{ background-color: #944e74;}
    </style>
</head>
<body class="p-4 bg-light">

<div class="container" style="max-width: 600px;">
    <h2 class="text-success fw-bold text-center mb-4">🏆 Classificação Geral</h2>
    
    <div id="loading" class="text-center text-muted">Carregando ranking...</div>
    
    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-success">
            <tr>
                <th>Pos</th>
                <th>Nome Completo</th>
                <th>Usuário</th>
                <th class="text-center">Pontos</th>
            </tr>
        </thead>
        <tbody id="tabelaRanking"></tbody>
    </table>

    <a href="menu.html" class="btn btn-secondary w-100 mt-3">Voltar ao Menu</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const db = supabase.createClient("https://phirqisfutnwqhhswjxh.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY");

    document.addEventListener("DOMContentLoaded", async () => {
        const tabela = document.getElementById('tabelaRanking');
        const loading = document.getElementById('loading');

        try {
            // 1. Busca os palpites ordenados pela pontuação
            const { data: palpites, error: errPalpites } = await db
                .from('palpitescopa')
                .select('nome_usuario, pontuacao')
                .order('pontuacao', { ascending: false });

            // 2. Busca todos os usuários para cruzar os dados
            const { data: usuarios, error: errUsuarios } = await db
                .from('palpiteiro')
                .select('usuario, nome_completo');

            if (errPalpites || errUsuarios) throw new Error("Erro ao buscar dados do banco.");

            loading.style.display = 'none';

            if (palpites.length === 0) {
                tabela.innerHTML = `<tr><td colspan="4" class="text-center">Nenhum palpite registrado ainda.</td></tr>`;
                return;
            }

            // 3. Monta a tabela
            palpites.forEach((p, index) => {
                const userObj = usuarios.find(u => u.usuario === p.nome_usuario);
                const nomeCompleto = userObj ? userObj.nome_completo : "Desconhecido";

                tabela.innerHTML += `
                    <tr>
                        <td>${index + 1}º</td>
                        <td>${nomeCompleto}</td>
                        <td>${p.nome_usuario}</td>
                        <td class="text-center fw-bold text-success">${p.pontuacao}</td>
                    </tr>
                `;
            });

        } catch (err) {
            loading.style.display = 'none';
            tabela.innerHTML = `<tr><td colspan="4" class="text-danger text-center">${err.message}</td></tr>`;
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container text-center mt-5">
    <h2>Bem-vindo, <span id="displayUser" class="text-success fw-bold"></span>!</h2>
    
    <div class="d-grid gap-3 mt-4 mx-auto" style="max-width: 300px;">
        <a href="palpites.html" class="btn btn-primary btn-lg">📝 Fazer Palpites</a>
        <a href="classificacao_geral.html" class="btn btn-success btn-lg">📊 Classificação Geral</a>
        <a href="meus_palpites.html" class="btn btn-info btn-lg">👁️ Ver meus Palpites</a>
        <button onclick="logout()" class="btn btn-outline-danger mt-4">Sair da conta</button>
    </div>
</div>

<script>
    // 1. Verificação imediata: Se não tem usuário, expulsa antes mesmo de carregar o resto
    if (!localStorage.getItem("bolao_user")) {
        window.location.href = "./bolao.html";
    }

    // 2. Lógica de exibição e logout
    document.addEventListener("DOMContentLoaded", () => {
        const usuarioLogado = localStorage.getItem("bolao_user");
        const spanUser = document.getElementById("displayUser");
        
        if (spanUser && usuarioLogado) {
            spanUser.innerText = usuarioLogado;
        }
    });

    function logout() {
        localStorage.removeItem("bolao_user");
        window.location.href = "./bolao.html";
    }
</script>

</body>
</html>

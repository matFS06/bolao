<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Evita cache e back/forward mostrando página antiga -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Menu - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Configuração da imagem de fundo */
        body {
            background-image: url('bg_bolao.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f8f9fa; /* Cor de suporte caso a imagem não carregue */
        }

        /* Adiciona um leve fundo translúcido ao conteúdo para facilitar a leitura */
        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container text-center mt-5">
    <h2>Bem-vindo, <span id="displayUser" class="text-success fw-bold"></span>!</h2>
    
    <div class="d-grid gap-3 mt-4 mx-auto" style="max-width: 300px;">
        <a href="palpites_semis.html" class="btn btn-primary btn-lg">📝 Fazer Palpites</a>
        <a href="classificacao_geral.html" class="btn btn-success btn-lg">📊 Classificação Geral</a>
        <a href="meus_palpites.html" class="btn btn-info btn-lg">👁️ Ver meus Palpites</a>
        <button onclick="logout()" class="btn btn-outline-danger mt-4">Sair da conta</button>
    </div>
</div>

<script>
    // Função de logout
    function logout() {
        localStorage.removeItem("bolao_user");
        window.location.replace("./index.html");
    }

    // Função de verificação de login
    function checkLogin() {
        const usuarioLogado = localStorage.getItem("bolao_user");
        if (!usuarioLogado) {
            logout(); // força logout se não estiver logado
            return;
        }

        // Exibe o usuário logado
        const spanUser = document.getElementById("displayUser");
        if (spanUser) spanUser.innerText = usuarioLogado;
    }

    // Verifica login assim que a página carrega
    checkLogin();

    // Quando a página é exibida do cache (back/forward)
    window.addEventListener("pageshow", (event) => {
        checkLogin();
    });

    // Detecta quando a aba volta a ficar visível (ex: usuário volta do login)
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            checkLogin();
        }
    });
</script>

</body>
</html>

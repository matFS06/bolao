<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Palpites - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-image: url('bg_bolao.png'); background-size: cover; background-position: center; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 90%; max-width: 800px; background-color: rgba(255, 255, 255, 0.9); padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .group-header { background: #28a745; color: white; padding: 5px; font-weight: bold; }
        .badge-nao-palpitou { font-size: 0.7em; color: #888; font-style: italic; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <h2 class="text-success fw-bold mb-4">🏆 Meus Palpites</h2>
    <div id="divPontuacao" class="alert alert-success shadow-sm text-center fw-bold fs-4 mb-4" style="display: none;"></div>
    <div id="loading" class="text-center my-5"><div class="spinner-border text-success"></div></div>
    <div id="resultadoPalpites"></div>
    <div class="mt-4"><a href="menu.html" class="btn btn-secondary w-100">Voltar ao Menu</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const db = supabase.createClient("https://phirqisfutnwqhhswjxh.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY");

    // Função para tratar a exibição do palpite
    function formatarPalpite(valM, valV) {
        if (valM === null || valV === null) {
            return `<span class="badge-nao-palpitou">Não palpitou</span>`;
        }
        return `<b>${valM} x ${valV}</b>`;
    }

    const jogosConfig = {
        'a': ["México x África do Sul", "Coreia do Sul x Rep. Tcheca", "Rep. Tcheca x África do Sul", "México x Coreia do Sul", "África do Sul x Coreia do Sul", "Rep. Tcheca x México"],
        'b': ["Canadá x Bósnia", "Catar x Suíça", "Suíça x Bósnia", "Canadá x Catar", "Suíça x Canadá", "Bósnia x Catar"],
        'c': ["Brasil x Marrocos", "Haiti x Escócia", "Escócia x Marrocos", "Brasil x Haiti", "Marrocos x Haiti", "Escócia x Brasil"],
        'd': ["EUA x Paraguai", "Austrália x Turquia", "EUA x Austrália", "Turquia x Paraguai", "Turquia x EUA", "Paraguai x Austrália"],
        'e': ["Alemanha x Curaçau", "Costa do Marfim x Equador", "Alemanha x Costa do Marfim", "Equador x Curaçau", "Equador x Alemanha", "Curaçau x Costa do Marfim"],
        'f': ["Holanda x Japão", "Suécia x Tunísia", "Holanda x Suécia", "Tunísia x Japão", "Tunísia x Holanda", "Japão x Suécia"],
        'g': ["Bélgica x Egito", "Irã x N. Zelândia", "Bélgica x Irã", "N. Zelândia x Egito", "Egito x Irã", "N. Zelândia x Bélgica"],
        'h': ["Espanha x Cabo Verde", "Arábia Saudita x Uruguai", "Espanha x Arábia Saudita", "Uruguai x Cabo Verde", "Cabo Verde x Arábia Saudita", "Uruguai x Espanha"],
        'i': ["França x Senegal", "Iraque x Noruega", "França x Iraque", "Noruega x Senegal", "Senegal x Iraque", "Noruega x França"],
        'j': ["Argentina x Argélia", "Áustria x Jordânia", "Argentina x Áustria", "Jordânia x Argélia", "Jordânia x Argentina", "Argélia x Áustria"],
        'k': ["Portugal x RD Congo", "Uzbequistão x Colômbia", "Portugal x Uzbequistão", "Colômbia x RD Congo", "RD Congo x Uzbequistão", "Colômbia x Portugal"],
        'l': ["Inglaterra x Croácia", "Gana x Panamá", "Inglaterra x Gana", "Panamá x Croácia", "Croácia x Gana", "Panamá x Inglaterra"]
    };

    const jogos16avos = ["Alemanha x Paraguai", "França x Suécia", "África do Sul x Canadá", "Holanda x Marrocos", "Portugal x Croácia", "Espanha x Áustria", "EUA x Bósnia", "Bélgica x Senegal", "Brasil x Japão", "Costa do Marfim x Noruega", "México x Equador", "Inglaterra x RD Congo", "Argentina x Cabo Verde", "Austrália x Egito", "Suíça x Argélia", "Colômbia x Gana"];

    document.addEventListener("DOMContentLoaded", async () => {
        const usuarioLogado = localStorage.getItem("bolao_user");
        if (!usuarioLogado) { window.location.href = "./index.html"; return; }

        const { data } = await db.from('palpitescopa').select('*').eq('nome_usuario', usuarioLogado);
        document.getElementById('loading').style.display = 'none';

        if (!data || data.length === 0) {
            document.getElementById('resultadoPalpites').innerHTML = `<div class="alert alert-info">Você ainda não enviou nenhum palpite.</div>`;
        } else {
            const p = data[data.length - 1];
            document.getElementById('divPontuacao').style.display = 'block';
            document.getElementById('divPontuacao').innerText = `📊 Sua pontuação: ${p.pontuacao || 0} pts`;

            let html = `<h4>Olá, <strong>${usuarioLogado}</strong>!</h4><hr>`;
            
            // Grupos e placares seguindo a mesma lógica:
            html += `<h5 class="mt-4">Placares dos Jogos (Fase de Grupos):</h5>`;
            for (let letra in jogosConfig) {
                let offset = (letra.charCodeAt(0) - 97) * 6;
                html += `
                <div class="mb-2">
                    <div class="bg-light p-2 border rounded">
                        <div class="fw-bold mb-2">Grupo ${letra.toUpperCase()}</div>
                        ${jogosConfig[letra].map((jogo, i) => {
                            let idx = offset + i + 1;
                            return `<div class="row text-center mb-1"><div class="col-6">${jogo}</div><div class="col-6">${formatarPalpite(p['j'+idx+'m'], p['j'+idx+'v'])}</div></div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            // 16 Avos
            html += `<h5 class="mt-4">Palpites: 16 Avos de Final</h5>`;
            for (let i = 1; i <= 16; i++) {
                html += `<div class="row text-center border-bottom py-1">
                    <div class="col-8 text-start small">${jogos16avos[i-1]}</div>
                    <div class="col-4">${formatarPalpite(p['a'+i+'m'], p['a'+i+'v'])}</div>
                </div>`;
            }

            document.getElementById('resultadoPalpites').innerHTML = html;
        }
    });
</script>
</body>
</html>

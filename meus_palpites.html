<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Palpites - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            /* A imagem acompanha o redimensionamento da janela */
            background-image: url('bg_bolao.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Remover o 'fixed' faz com que a imagem role com a página, 
            o que ajuda a dar a sensação de que ela está "presa" ao conteúdo */
            background-attachment: scroll; 
            
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            /* O container vai encolher naturalmente com o zoom 
            por causa do max-width e da largura relativa */
            width: 90%;
            max-width: 500px; 
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="p-4">

<div class="container" style="max-width: 800px;">
    <h2 class="text-success fw-bold mb-4">🏆 Meus Palpites</h2>

    <div id="divPontuacao" class="alert alert-success shadow-sm text-center fw-bold fs-4 mb-4" style="display: none;">
        Carregando sua pontuação...
    </div>
    
    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-success" role="status"></div>
        <p>Buscando seus palpites no sistema...</p>
    </div>

    <div id="resultadoPalpites"></div>

    <div class="mt-4">
        <a href="menu.html" class="btn btn-secondary w-100">Voltar ao Menu</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://phirqisfutnwqhhswjxh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const jogosConfig = {
        'a': ["México x África do Sul", "Coreia do Sul x Rep. Tcheca", "Rep. Tcheca x África do Sul", "México x Coreia do Sul", "África do Sul x Coreia do Sul", "Rep. Tcheca x México"],
        'b': ["Canadá x Bósnia", "Catar x Suíça", "Suíça x Bósnia", "Canadá x Catar", "Suíça x Canadá", "Bósnia x Catar"],
        'c': ["Brasil x Marrocos", "Haiti x Escócia", "Escócia x Marrocos", "Brasil x Haiti", "Marrocos x Haiti", "Escócia x Brasil"],
        'd': ["EUA x Paraguai", "Austrália x Turquia", "EUA x Austrália", "Turquia x Paraguai", "Turquia x EUA", "Paraguai x Austrália"],
        'e': ["Alemanha x Curaçau", "Costa do Marfim x Equador", "Alemanha x Costa do Marfim", "Equador x Curaçau", "Equador x Alemanha", "Curaçau x Costa do Marfim"],
        'f': ["Holanda x Japão", "Suécia x Tunísia", "Holanda x Suécia", "Tunísia x Japão", "Tunísia x Holanda", "Japão x Suécia"],
        'g': ["Bélgica x Egito", "Irã x N. Zelândia", "Bélgica x Irã", "N. Zelândia x Egito", "Egito x Irã", "N. Zelândia x Bélgica"],
        'h': ["Espanha x Cabo Verde", "Arábia Saudita x Uruguai", "Espanha x Arábia Saudita", "Uruguai x Cabo Verde", "Cabo Verde x Arábia Saudita", "Uruguai x Espanha"],
        'i': ["França x Senegal", "Iraque x Noruega", "França x Iraque", "Noruega x Senegal", "Senegal x Iraque", "Noruega x França"],
        'j': ["Argentina x Argélia", "Áustria x Jordânia", "Argentina x Áustria", "Jordânia x Argélia", "Jordânia x Argentina", "Argélia x Áustria"],
        'k': ["Portugal x RD Congo", "Uzbequistão x Colômbia", "Portugal x Uzbequistão", "Colômbia x RD Congo", "RD Congo x Uzbequistão", "Colômbia x Portugal"],
        'l': ["Inglaterra x Croácia", "Gana x Panamá", "Inglaterra x Gana", "Panamá x Croácia", "Croácia x Gana", "Panamá x Inglaterra"]
    };

    document.addEventListener("DOMContentLoaded", async () => {
        const usuarioLogado = localStorage.getItem("bolao_user");
        if (!usuarioLogado) { window.location.href = "./index.html"; return; }

        const { data, error } = await db
            .from('palpitescopa')
            .select('*')
            .eq('nome_usuario', usuarioLogado);

        const container = document.getElementById('resultadoPalpites');
        const divPontos = document.getElementById('divPontuacao');
        document.getElementById('loading').style.display = 'none';

        if (error) {
            container.innerHTML = `<div class="alert alert-danger">Erro ao carregar: ${error.message}</div>`;
        } else if (!data || data.length === 0) {
            container.innerHTML = `<div class="alert alert-info">Você ainda não enviou nenhum palpite.</div>`;
        } else {
            const p = data[data.length - 1];
            
            // Exibir pontuação
            divPontos.style.display = 'block';
            divPontos.innerText = `📊 Sua pontuação atual: ${p.pontuacao || 0} pontos`;

            let html = `<h4>Olá, <strong>${usuarioLogado}</strong>!</h4><hr>`;
            
            // 1. Grupos
            html += `<div class="row">`;
            const letras = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l'];
            letras.forEach(letra => {
                html += `
                <div class="col-md-4 col-6 mb-3">
                    <div class="border rounded bg-white text-center">
                        <div class="group-header">Grupo ${letra.toUpperCase()}</div>
                        <div class="p-2">1º: <b>${p[`grupo_${letra}_1`]}</b><br>2º: <b>${p[`grupo_${letra}_2`]}</b></div>
                    </div>
                </div>`;
            });
            html += `</div>`;

            // 2. Placares
            html += `<h5 class="mt-4">Placares dos Jogos:</h5>`;
            for (let letra in jogosConfig) {
                let offset = (letra.charCodeAt(0) - 97) * 6;
                html += `
                <button class="btn btn-outline-success w-100 mb-2" data-bs-toggle="collapse" data-bs-target="#palpitesGrupo${letra.toUpperCase()}">
                    ⬇️ Palpites: Grupo ${letra.toUpperCase()}
                </button>
                <div class="collapse mb-3" id="palpitesGrupo${letra.toUpperCase()}">
                    <div class="bg-light p-3 border rounded">
                        ${jogosConfig[letra].map((jogo, i) => {
                            let idx = offset + i + 1;
                            return `<div class="row text-center mb-1"><div class="col-6">${jogo}</div><div class="col-6"><b>${p['j'+idx+'m']} x ${p['j'+idx+'v']}</b></div></div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            // 3. Finais
            html += `
            <div class="card mt-4 border-success shadow-sm">
                <div class="card-body">
                    <h5 class="text-success fw-bold">🏆 Colocações Finais e 1º Gol do Brasil</h5>
                    <p>🥇 Campeão: <b>${p.campeao}</b> | 🥈 Vice: <b>${p.vice}</b></p>
                    <p>🥉 3º Lugar: <b>${p.terceiro}</b> | 🏅 4º Lugar: <b>${p.quarto}</b></p>
                    <p>⚽ Autor do 1º Gol do Brasil: <b>${p.autor_gol}</b></p>
                </div>
            </div>`;
            
            container.innerHTML = html;
        }
    });
</script>
</body>
</html>

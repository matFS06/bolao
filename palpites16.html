<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Usamos um nome de variável diferente (sbClient) para evitar conflitos com a biblioteca
    const SUPABASE_URL = "https://phirqisfutnwqhhswjxh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY";
    
    // Criamos a instância do cliente com um nome único
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('bolao_user')) {
            window.location.href = 'index.html';
        }
    });

    document.getElementById('formBolao').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const usuarioLogado = localStorage.getItem('bolao_user');
        
        const payload = {
            nome_usuario: usuarioLogado
        };

        for (let i = 1; i <= 16; i++) {
            payload[`a${i}m`] = parseInt(document.querySelector(`input[name="a${i}_1"]`).value) || 0;
            payload[`a${i}v`] = parseInt(document.querySelector(`input[name="a${i}_2"]`).value) || 0;
        }

        // Usamos a variável sbClient aqui
        const { data, error } = await sbClient
            .from('palpitescopa')
            .insert([payload]);

        if (error) {
            console.error('Erro:', error);
            alert('Erro ao salvar: ' + error.message);
        } else {
            alert('Palpites enviados com sucesso!');
            window.location.href = 'menu.html';
        }
    });
</script>

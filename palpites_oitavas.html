<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bolão 2026 - Oitavas de Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .match-card { background: white; border-radius: 12px; padding: 12px 20px; margin-bottom: 10px; transition: all 0.3s; border-left: 5px solid #2c3e50; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-placar { width: 50px; height: 50px; text-align: center; border: 2px solid #ddd; border-radius: 8px; font-weight: bold; font-size: 1.2rem; }
        .team-name { font-weight: 600; font-size: 0.95rem; }
        .flag-img { width: 28px; height: 20px; border-radius: 2px; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <h3 class="text-center mb-4">🏆 Oitavas de Final</h3>
            <form id="formBolao">
                <!-- Jogo 1: Paraguai x França -->
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">Paraguai</span> <img src="https://flagcdn.com/28x21/py.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o1_1" required> x <input type="number" class="input-placar mx-2" name="o1_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/fr.png" class="flag-img"> <span class="team-name ms-2">França</span></div></div>
                
                <!-- Jogo 2: Canadá x Marrocos (BLOQUEADO) -->
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">Canadá</span> <img src="https://flagcdn.com/28x21/ca.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o2_1" disabled placeholder="-"> x <input type="number" class="input-placar mx-2" name="o2_2" disabled placeholder="-"></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/ma.png" class="flag-img"> <span class="team-name ms-2">Marrocos</span></div></div>
                
                <!-- Jogo 3 a 8 -->
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">Portugal</span> <img src="https://flagcdn.com/28x21/pt.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o3_1" required> x <input type="number" class="input-placar mx-2" name="o3_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/es.png" class="flag-img"> <span class="team-name ms-2">Espanha</span></div></div>
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">EUA</span> <img src="https://flagcdn.com/28x21/us.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o4_1" required> x <input type="number" class="input-placar mx-2" name="o4_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/be.png" class="flag-img"> <span class="team-name ms-2">Bélgica</span></div></div>
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">Brasil</span> <img src="https://flagcdn.com/28x21/br.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o5_1" required> x <input type="number" class="input-placar mx-2" name="o5_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/no.png" class="flag-img"> <span class="team-name ms-2">Noruega</span></div></div>
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">México</span> <img src="https://flagcdn.com/28x21/mx.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o6_1" required> x <input type="number" class="input-placar mx-2" name="o6_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/gb-eng.png" class="flag-img"> <span class="team-name ms-2">Inglaterra</span></div></div>
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">Argentina</span> <img src="https://flagcdn.com/28x21/ar.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o7_1" required> x <input type="number" class="input-placar mx-2" name="o7_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/eg.png" class="flag-img"> <span class="team-name ms-2">Egito</span></div></div>
                <div class="match-card row align-items-center text-center"><div class="col-4 d-flex justify-content-end align-items-center"><span class="team-name me-2">Suíça</span> <img src="https://flagcdn.com/28x21/ch.png" class="flag-img"></div><div class="col-4 d-flex justify-content-center align-items-center"><input type="number" class="input-placar mx-2" name="o8_1" required> x <input type="number" class="input-placar mx-2" name="o8_2" required></div><div class="col-4 d-flex justify-content-start align-items-center"><img src="https://flagcdn.com/28x21/co.png" class="flag-img"> <span class="team-name ms-2">Colômbia</span></div></div>
                
                <button type="submit" class="btn btn-success btn-lg w-100 mt-4">Confirmar Palpites</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const sbClient = supabase.createClient("https://phirqisfutnwqhhswjxh.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaXJxaXNmdXRud3FoaHN3anhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NTMsImV4cCI6MjA5NTkyNTQ1M30.cMAmQiU5rk2-sc6K-KR0-is_ov855BnnA7a4ioCNKcY");
    
    // Bloqueia o Jogo 2
    const jogosBloqueados = [2];

    document.getElementById('formBolao').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuarioLogado = localStorage.getItem('bolao_user');
        
        const { data: usuarioData, error: erroFetch } = await sbClient
            .from('palpitescopa')
            .select('*')
            .eq('nome_usuario', usuarioLogado)
            .single();

        if (erroFetch) {
            alert('Erro ao verificar status: ' + erroFetch.message);
            return;
        }

        let jaPalpitou = false;
        for (let i = 1; i <= 8; i++) {
            if (jogosBloqueados.includes(i)) continue; 
            if (usuarioData[`o${i}m`] !== null || usuarioData[`o${i}v`] !== null) {
                jaPalpitou = true;
                break;
            }
        }

        if (jaPalpitou) {
            alert('Você já submeteu seus palpites desta fase!');
            return; 
        }

        const payload = {};
        for (let i = 1; i <= 8; i++) {
            if (jogosBloqueados.includes(i)) continue; 
            payload[`o${i}m`] = parseInt(document.querySelector(`input[name="o${i}_1"]`).value) || 0;
            payload[`o${i}v`] = parseInt(document.querySelector(`input[name="o${i}_2"]`).value) || 0;
        }

        const { error: erroUpdate } = await sbClient
            .from('palpitescopa')
            .update(payload)
            .eq('nome_usuario', usuarioLogado);

        if (erroUpdate) {
            alert('Erro ao salvar: ' + erroUpdate.message);
        } else {
            alert('Palpites enviados com sucesso!');
            window.location.href = 'menu.html';
        }
    });
</script>
</body>
</html>
